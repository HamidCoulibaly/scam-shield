name: Daily scam list

on:
  schedule:
    - cron: "17 4 * * *"      # every day at 04:17 UTC
  workflow_dispatch:           # "Run workflow" button for a manual run
  push:
    paths:
      - "collector/data/**"    # rebuild straight away when you add a number

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        working-directory: collector
        run: python -m unittest discover -s tests

      - name: Build list
        working-directory: collector
        env:
          TELLOWS_FEED_URL: ${{ secrets.TELLOWS_FEED_URL }}
          SCAM_SHIELD_ALLOWLIST: ${{ secrets.SCAM_SHIELD_ALLOWLIST }}
        run: python collector.py build

      - name: Publish if changed
        run: |
          git config user.name "scam-shield-bot"
          git config user.email "scam-shield-bot@users.noreply.github.com"
          git add collector/dist
          if git diff --cached --quiet; then
            echo "List unchanged."
          else
            git commit -m "Daily scam list $(date -u +%F)"
            git push
          fi
